# Used only for version bumps (git-cliff --bumped-version in the deploy workflow)
[changelog]
body = ""

[git]
conventional_commits = true
filter_unconventional = true
protect_breaking_commits = true
tag_pattern = "^[0-9]+\\.[0-9]+\\.[0-9]+$"
commit_parsers = [
  { message = "^(feat|fix|hotfix|bugfix|perf)", group = "Changes" },
  { message = ".*", skip = true },
]

[bump]
features_always_bump_minor = true
breaking_always_bump_major = true
initial_tag = "0.2.2"
