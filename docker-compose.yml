name: akanebot

services:
  akane-bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: akane-bot:latest
    container_name: akane-bot
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./akane_db.db:/app/akane_db.db
      - ./logs:/app/logs
      - ./pictures:/app/pictures
      - ./config.json:/app/config.json
      - ./extensions:/app/extensions
    labels:
      icon: https://files.isaber.in/akanepfp.webp

# Lets CasaOS list the bot on its dashboard. Change settings here, not in the
# CasaOS app settings: saving there rewrites this file with the tokens inlined.
x-casaos:
  author: self
  category: self
  hostname: ""
  icon: https://files.isaber.in/akanepfp.webp
  index: /
  is_uncontrolled: false
  port_map: ""
  scheme: http
  title:
    custom: AkaneBot
